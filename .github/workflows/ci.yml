name: CI

# text-adventure-rpg（文字冒险 RPG：FastAPI + OpenAI 兼容直调 + React18/Vite 前端）
#
# test job 是第 15 章「自动化测试与 CI/CD」教学实物：三 OS × 三 Python 矩阵跑
# pytest + 两条 console 入口烟雾测试。
# frontend job 是前端构建门（tsc strict + vite；仓 CLAUDE.md 验收项）。
# deploy job 是 agent 家族部署链（docs/families/agent.md，2026-10-06 起 5305/5405）：
# tag push → 双镜像（-api / -web）build & push → VPS deploy/text-adventure-rpg.sh
# 拉镜像 + 渲染 vhost（text-adventure.xiangru.uk）+ 起容器 + /api/health 探活。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v

      - name: Smoke test entrypoints
        # 验证 console_scripts 已正确注册（第 15 章「CI/CD 烟雾测试」实物）。
        # 两条入口分别归属不同章节案例：text-rpg（005 __main__）与 text-full-rpg（002 game）。
        # 用 EOF 让游戏立刻退出，不进入交互。
        shell: bash
        run: |
          echo "quit" | text-rpg
          echo "quit" | text-full-rpg

  frontend:
    name: Frontend (Node 22 + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci，npm 走 npmmirror)
        run: npm ci --registry=https://registry.npmmirror.com --no-audit --no-fund

      - name: Build (tsc + vite，类型错误即红)
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-api:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-api:${{ github.ref_name }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-web:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}-web:${{ github.ref_name }}

      - name: Pull images and restart containers on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env, with.envs 列出要转发的名字（逗号分隔）。
        # LLM_API_KEY 仅首启 bootstrap 需要（env-file 已有真 key 时后续 deploy 可缺省）。
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          NGINX_DOMAIN: ${{ vars.NGINX_DOMAIN }}
          NGINX_CERT_BASENAME: ${{ vars.NGINX_CERT_BASENAME }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: LLM_API_KEY,NGINX_DOMAIN,NGINX_CERT_BASENAME
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # 总是重拉最新 deploy 脚本（脚本 bug fix 立即生效）；nginx 模板由脚本自拉
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/main/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            echo "→ env on remote: LLM_API_KEY_set=$([ -n \"${LLM_API_KEY:-}\" ] && echo yes || echo no)"
            if [ ! -f "$REPO.env" ] && [ -z "${LLM_API_KEY:-}" ]; then
              echo "ERROR: $REPO.env missing AND LLM_API_KEY secret not forwarded, deploy script will fail-fast" >&2
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
